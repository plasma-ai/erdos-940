name = "Erdos940"
defaultTargets = ["ClassFieldTheory", "CebotarevDensity", "Erdos940", "Challenge", "Solution"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc4"

# Import closure of n-yamaguchi-0729/ClassFieldTheory used by the quartic case,
# under its upstream module names.
[[lean_lib]]
name = "ClassFieldTheory"
srcDir = "vendor/ClassFieldTheory"
globs = ["ClassFieldTheory.+", "ValuedFieldTheory.+", "GaloisCohomology.+", "ProCGroups.+"]
leanOptions = {relaxedAutoImplicit = false}

# The Chebotarev density theorem from CBirkbeck/AINTLIB, with its upstream options.
[[lean_lib]]
name = "CebotarevDensity"
srcDir = "vendor/AINTLIB"
globs = ["CebotarevDensity.*"]
leanOptions = {relaxedAutoImplicit = false, maxSynthPendingDepth = 3}

[[lean_lib]]
name = "Erdos940"
globs = ["Erdos940.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
